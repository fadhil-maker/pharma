<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Secure Admin Login for Pharma Tracker by Zuloo">
    <title>Admin Login — Clinical Pharmacy Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Premium Soft UI (Light) */
            --bg-main: #e8f4f8; /* Soft pale cyan/blue from mockup */
            --card-bg: #ffffff;
            --text-main: #1a202c;
            --text-muted: #718096;
            --accent: #0ea5e9;
            --accent-hover: #0284c7;
            --border-light: rgba(14, 165, 233, 0.15);
            --shadow-soft: 0 10px 40px -10px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 20px 40px -10px rgba(14, 165, 233, 0.15);
            --radius-lg: 24px;
            --radius-md: 14px;
        }
        
        [data-theme="dark"] {
            /* Sleek Dark Mode */
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #7dd3fc;
            --border-light: rgba(56, 189, 248, 0.15);
            --shadow-soft: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
            --shadow-hover: 0 20px 40px -10px rgba(56, 189, 248, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease; }

        body {
            background: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
        }

        .login-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 44px 36px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.08), 0 10px 20px -5px rgba(14, 165, 233, 0.05);
            border: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .logo {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 6px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 28px;
            font-weight: 600;
        }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg-main);
            border: 1.5px solid var(--border-light);
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.15);
            background: var(--card-bg);
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(14, 165, 233, 0.4);
            transition: all 0.2s ease;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(14, 165, 233, 0.5);
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 700;
            width: 100%;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo">🛡️ Admin Console Login</div>
    <div class="subtitle">Clinical Pharmacy System Administration</div>
    
    <div class="error-msg" id="errorMsg"></div>

    <form onsubmit="handleLogin(event)">
        <div class="form-group">
            <label for="username">Admin Username</label>
            <input type="text" id="username" placeholder="e.g. admin" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-submit">Login to Admin Console ➔</button>
    </form>

    <!-- Zuloo Premium Footer -->
    <footer style="margin-top: 40px; padding: 20px; text-align: center; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 16px;">
        <a href="https://zuloo.vercel.app" target="_blank" rel="noopener" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 12px; transition: transform 0.3s ease;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
            <svg width="40" height="40" viewBox="280 180 220 220" xmlns="http://www.w3.org/2000/svg">
              <path d="M 320 200 L 460 200 L 340 320 L 460 320 A 20 20 0 0 1 480 340 L 480 360 A 20 20 0 0 1 460 380 L 320 380 L 440 260 L 320 260 A 20 20 0 0 1 300 240 L 300 220 A 20 20 0 0 1 320 200 Z" fill="none" stroke="#0ea5e9" stroke-width="24px" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span style="font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 800; color: var(--text-main); letter-spacing: 1px;">Zuloo</span>
        </a>
    </footer>

</div>

<script>
const API_BASE = window.location.origin;

async function handleLogin(e) {
    e.preventDefault();
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value.trim();
    const errEl = document.getElementById('errorMsg');

    try {
        const res = await fetch(`${API_BASE}/api/admin/login/`, {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        
        if (res.ok) {
            localStorage.setItem('adminUser', data.username);
            window.location.href = 'admin.html';
        } else {
            errEl.textContent = data.error || 'Login failed.';
            errEl.style.display = 'block';
        }
    } catch(err) {
        errEl.textContent = 'Server connection error.';
        errEl.style.display = 'block';
    }
}

        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', target);
            const text = document.getElementById('themeText');
            if(text) text.textContent = target === 'dark' ? 'Light Mode' : 'Dark Mode';
        }
        </script>

</body>
</html>
