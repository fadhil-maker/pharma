<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Secure Admin Login for Pharma Tracker by Zuloo">
    <title>Admin Login — Clinical Pharmacy Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Premium Soft UI (Light) */
            --bg-main: #e8f4f8; /* Soft pale cyan/blue from mockup */
            --card-bg: #ffffff;
            --text-main: #1a202c;
            --text-muted: #718096;
            --accent: #0ea5e9;
            --accent-hover: #0284c7;
            --border-light: rgba(14, 165, 233, 0.15);
            --shadow-soft: 0 10px 40px -10px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 20px 40px -10px rgba(14, 165, 233, 0.15);
            --radius-lg: 24px;
            --radius-md: 14px;
        }
        
        [data-theme="dark"] {
            /* Sleek Dark Mode */
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #7dd3fc;
            --border-light: rgba(56, 189, 248, 0.15);
            --shadow-soft: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
            --shadow-hover: 0 20px 40px -10px rgba(56, 189, 248, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease; }

        body {
            background: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container, .container { max-width: 1100px; width: 100%; position: relative; margin: 0 auto; }

        /* Themed Toggle - Clean Pill */
        .pill-toggle-container {
            position: absolute; top: 0px; right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 30px;
            padding: 10px 18px;
            cursor: pointer;
            box-shadow: var(--shadow-soft);
            display: flex; align-items: center; gap: 10px;
            font-weight: 800; font-size: 14px; color: var(--accent);
            z-index: 100;
        }
        .pill-toggle-container:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
        .pill-icon { font-size: 20px; }

        .top-header, .header { 
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; 
            background: var(--card-bg); padding: 20px 32px; border-radius: var(--radius-lg); 
            box-shadow: var(--shadow-soft); border: 1px solid var(--border-light);
        }
        
        .brand-logo, .logo { 
            display: flex; align-items: center; gap: 12px; font-family: 'Outfit', sans-serif; 
            font-size: 22px; font-weight: 900; color: var(--text-main); text-decoration: none; 
        }
        .brand-logo span, .logo span { color: var(--accent); }

        .card { 
            background: var(--card-bg); border-radius: var(--radius-lg); padding: 32px; 
            margin-bottom: 32px; box-shadow: var(--shadow-soft); border: 1px solid var(--border-light); 
        }
        
        .card-title { 
            font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 800; 
            margin-bottom: 24px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; 
        }

        /* Beautiful Scanner Dropzone */
        .scanner-dropzone { 
            background: rgba(14, 165, 233, 0.05); border: 2px dashed var(--accent); 
            border-radius: var(--radius-lg); padding: 50px 20px; text-align: center; 
            cursor: pointer; transition: all 0.3s ease; 
        }
        .scanner-dropzone:hover { background: rgba(14, 165, 233, 0.1); transform: scale(1.02); }
        [data-theme="dark"] .scanner-dropzone { background: rgba(56, 189, 248, 0.05); }

        .input-group, .form-grid { display: grid; gap: 16px; margin-bottom: 16px; }
        .input-group { grid-template-columns: 1fr 200px 140px; }
        .form-grid { grid-template-columns: 1fr 1fr; }

        @media (max-width: 768px) { 
            .input-group, .form-grid { grid-template-columns: 1fr; } 
            .top-header, .header { padding: 16px; flex-direction: column; gap: 16px; }
            .pill-toggle-container { top: -20px; right: 10px; padding: 6px 12px; font-size: 12px; }
            .pill-icon { font-size: 16px; }
            .nav-actions { width: 100%; justify-content: center; flex-wrap: wrap; }
            .hero-title { font-size: 26px; }
        }

        label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 8px; color: var(--text-muted); text-transform: uppercase; }
        input, select, textarea { 
            width: 100%; padding: 16px; background: var(--bg-main); border: 1px solid transparent; 
            border-radius: var(--radius-md); color: var(--text-main); font-size: 15px; outline: none; 
        }
        input:focus, select:focus, textarea:focus { border: 1px solid var(--accent); box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1); }
        [data-theme="dark"] input { background: #0f172a; border-color: rgba(255,255,255,0.05); }

        .btn { 
            padding: 14px 24px; border-radius: var(--radius-md); border: none; font-weight: 800; font-size: 14px; 
            cursor: pointer; background: var(--card-bg); color: var(--text-main); 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid var(--border-light); transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
        .btn-cyan { background: var(--accent); color: #fff; border: none; }
        .btn-cyan:hover { background: var(--accent-hover); color: #fff; }
        .btn-danger { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: none; }
        .btn-danger:hover { background: #ef4444; color: #fff; }

        /* Other elements */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .stat-card { background: var(--card-bg); border-radius: var(--radius-lg); padding: 24px; text-align: center; box-shadow: var(--shadow-soft); border: 1px solid var(--border-light); }
        .stat-label { font-size: 12px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; }
        .stat-val { font-family: 'Outfit', sans-serif; font-size: 36px; font-weight: 900; color: var(--accent); margin-top: 8px; }

        table { width: 100%; border-collapse: collapse; margin-top: 16px; display: block; overflow-x: auto; white-space: nowrap; }
        th, td { padding: 16px; text-align: left; border-bottom: 1px solid var(--border-light); }
        th { color: var(--text-muted); font-size: 12px; text-transform: uppercase; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 2000; }
        .modal-overlay.show { display: flex; }
        .modal-card { background: var(--card-bg); border-radius: var(--radius-lg); padding: 40px; max-width: 500px; width: 90%; box-shadow: 0 25px 50px rgba(0,0,0,0.25); border: 1px solid var(--border-light); }
        
        /* Dropdowns and gauges */
        .premium-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: var(--card-bg); border-radius: var(--radius-md); box-shadow: var(--shadow-soft); border: 1px solid var(--border-light); margin-top: 12px; max-height: 250px; overflow-y: auto; display: none; z-index: 100; padding: 8px; }
        .premium-dropdown.active { display: block; }
        .dropdown-item { padding: 12px 16px; cursor: pointer; border-radius: 8px; font-weight: 600; display: flex; justify-content: space-between; color: var(--text-main); }
        .dropdown-item:hover { background: rgba(14, 165, 233, 0.1); color: var(--accent); }
        
        .severity-gauge { width: 140px; height: 70px; border-radius: 140px 140px 0 0; background: conic-gradient(from 180deg at 50% 100%, #38a169 0deg, #dd6b20 90deg, #e53e3e 180deg); position: relative; margin: 0 auto 20px; }
        .severity-gauge::before { content: ''; position: absolute; bottom: 0; left: 15px; right: 15px; top: 15px; background: var(--card-bg); border-radius: 100px 100px 0 0; }
        .severity-needle { position: absolute; bottom: -5px; left: 50%; width: 4px; height: 60px; background: var(--text-main); transform-origin: bottom center; border-radius: 4px; transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 2px 2px 5px rgba(0,0,0,0.3); }
        .severity-needle::after { content: ''; position: absolute; bottom: 0; left: -4px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
        
        .organ-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 12px; }
        .organ-card { background: var(--bg-main); padding: 12px; border-radius: 12px; text-align: center; border: 1px solid var(--border-light); font-weight: 700; font-size: 13px; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo">🛡️ Admin Console Login</div>
    <div class="subtitle">Clinical Pharmacy System Administration</div>
    
    <div class="error-msg" id="errorMsg"></div>

    <form onsubmit="handleLogin(event)">
        <div class="form-group">
            <label for="username">Admin Username</label>
            <input type="text" id="username" placeholder="e.g. admin" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn">Login to Admin Console ➔</button>
    </form>

    <!-- Zuloo Premium Footer -->
    <footer style="margin-top: 40px; padding: 20px; text-align: center; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 16px;">
        <a href="https://zuloo.vercel.app" target="_blank" rel="noopener" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 12px; transition: transform 0.3s ease;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
            <svg width="40" height="40" viewBox="280 180 220 220" xmlns="http://www.w3.org/2000/svg">
              <path d="M 320 200 L 460 200 L 340 320 L 460 320 A 20 20 0 0 1 480 340 L 480 360 A 20 20 0 0 1 460 380 L 320 380 L 440 260 L 320 260 A 20 20 0 0 1 300 240 L 300 220 A 20 20 0 0 1 320 200 Z" fill="none" stroke="#0ea5e9" stroke-width="24px" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span style="font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 800; color: var(--text-main); letter-spacing: 1px;">Zuloo</span>
        </a>
    </footer>

</div>

<script>
const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') 
    ? 'http://127.0.0.1:8000' 
    : 'https://pharma.shanudigicore.com';

async function handleLogin(e) {
    e.preventDefault();
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value.trim();
    const errEl = document.getElementById('errorMsg');

    try {
        const res = await fetch(`${API_BASE}/api/admin/login/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        
        if (res.ok) {
            localStorage.setItem('adminUser', data.username);
            window.location.href = 'admin.html';
        } else {
            errEl.textContent = data.error || 'Login failed.';
            errEl.style.display = 'block';
        }
    } catch(err) {
        errEl.textContent = 'Server connection error.';
        errEl.style.display = 'block';
    }
}

        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', target);
            const text = document.getElementById('themeText');
            if(text) text.textContent = target === 'dark' ? 'Light Mode' : 'Dark Mode';
        }
        </script>

</body>
</html>
