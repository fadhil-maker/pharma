<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Secure Admin Login for Pharma Tracker by Zuloo">
    <title>Admin Login — Clinical Pharmacy Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #e0e5ec;
            --text-main: #2d3748;
            --text-muted: #718096;
            --accent: #3182ce;
            --shadow-light: rgba(255, 255, 255, 0.7);
            --shadow-dark: rgba(163, 177, 198, 0.6);
            --neu-shadow: 9px 9px 16px var(--shadow-dark), -9px -9px 16px var(--shadow-light);
            --neu-inset: inset 6px 6px 10px var(--shadow-dark), -6px -6px 10px var(--shadow-light);
            --radius-lg: 24px;
            --radius-md: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .login-card { background: var(--bg-main); border-radius: var(--radius-lg); padding: 40px; width: 100%; max-width: 400px; box-shadow: var(--neu-shadow); text-align: center; }
        .logo { font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 900; color: var(--accent); margin-bottom: 32px; }
        
        label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 8px; color: var(--text-muted); text-transform: uppercase; text-align: left; }
        input { width: 100%; padding: 14px; margin-bottom: 24px; background: var(--bg-main); border: none; border-radius: var(--radius-md); color: var(--text-main); font-size: 14px; box-shadow: var(--neu-inset); outline: none; transition: 0.2s; }
        input:focus { box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light), 0 0 0 2px var(--accent); }
        
        .btn { width: 100%; padding: 14px; border-radius: var(--radius-md); border: none; font-weight: 800; cursor: pointer; background: var(--bg-main); color: var(--accent); box-shadow: var(--neu-shadow); transition: all 0.2s; font-size: 15px; }
        .btn:active { box-shadow: var(--neu-inset); }
</style>
</head>
<body>

<div class="login-card">
    <div class="logo">🛡️ Admin Console Login</div>
    <div class="subtitle">Clinical Pharmacy System Administration</div>
    
    <div class="error-msg" id="errorMsg"></div>

    <form onsubmit="handleLogin(event)">
        <div class="form-group">
            <label for="username">Admin Username</label>
            <input type="text" id="username" placeholder="e.g. admin" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn">Login to Admin Console ➔</button>
    </form>

    <!-- Zuloo Premium Footer -->
    <footer style="margin-top: 40px; padding: 20px; text-align: center; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 16px;">
        <a href="https://zuloo.vercel.app" target="_blank" rel="noopener" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 12px; transition: transform 0.3s ease;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
            <svg width="40" height="40" viewBox="280 180 220 220" xmlns="http://www.w3.org/2000/svg">
              <path d="M 320 200 L 460 200 L 340 320 L 460 320 A 20 20 0 0 1 480 340 L 480 360 A 20 20 0 0 1 460 380 L 320 380 L 440 260 L 320 260 A 20 20 0 0 1 300 240 L 300 220 A 20 20 0 0 1 320 200 Z" fill="none" stroke="#0ea5e9" stroke-width="24px" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span style="font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 800; color: var(--text-main); letter-spacing: 1px;">Zuloo</span>
        </a>
    </footer>

</div>

<script>
const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') 
    ? 'http://127.0.0.1:8000' 
    : 'https://pharma.shanudigicore.com';

async function handleLogin(e) {
    e.preventDefault();
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value.trim();
    const errEl = document.getElementById('errorMsg');

    try {
        const res = await fetch(`${API_BASE}/api/admin/login/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        
        if (res.ok) {
            localStorage.setItem('adminUser', data.username);
            window.location.href = 'admin.html';
        } else {
            errEl.textContent = data.error || 'Login failed.';
            errEl.style.display = 'block';
        }
    } catch(err) {
        errEl.textContent = 'Server connection error.';
        errEl.style.display = 'block';
    }
}
</script>

</body>
</html>
