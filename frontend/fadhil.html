<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pharmacy Clinical Tracker - Admin User Management Portal">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>👥 Admin User Management — Clinician Portal</title>
    <link rel="manifest" href="manifest-admin.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-deep: #f0f4f8;
            --bg-card: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(99, 102, 241, 0.25);
            --accent: #4f46e5;
            --accent-light: #6366f1;
            --cyan: #0891b2;
            --success: #059669;
            --danger: #dc2626;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --radius: 16px;
            --radius-sm: 10px;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }
        body::before {
            content: '';
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(79, 70, 229, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(6, 182, 212, 0.06) 0%, transparent 50%);
            z-index: -1;
        }

        .header {
            padding: 32px 24px 20px;
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }
        .header-title h1 {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-title p {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 600;
            margin-top: 4px;
        }

        .hamburger-btn {
            display: none;
            width: 42px;
            height: 42px;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 10px;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .hamburger-btn:hover {
            background: rgba(79, 70, 229, 0.1);
            border-color: var(--accent);
        }
        .hamburger-btn .bar {
            display: block;
            width: 18px;
            height: 2px;
            background: var(--accent);
            border-radius: 2px;
            transition: all 0.3s ease;
            position: relative;
        }
        .hamburger-btn .bar::before,
        .hamburger-btn .bar::after {
            content: '';
            display: block;
            width: 18px;
            height: 2px;
            background: var(--accent);
            border-radius: 2px;
            transition: all 0.3s ease;
            position: absolute;
            left: 0;
        }
        .hamburger-btn .bar::before { top: -6px; }
        .hamburger-btn .bar::after { top: 6px; }
        .hamburger-btn.active .bar { background: transparent; }
        .hamburger-btn.active .bar::before { top: 0; transform: rotate(45deg); }
        .hamburger-btn.active .bar::after { top: 0; transform: rotate(-45deg); }

        @media (max-width: 768px) {
            .hamburger-btn {
                display: flex;
            }
            .header-actions {
                display: none;
                width: 100%;
                flex-direction: column;
                gap: 6px;
                margin-top: 14px;
                padding: 16px;
                background: rgba(255, 255, 255, 0.92);
                backdrop-filter: blur(20px);
                border: 1px solid rgba(99, 102, 241, 0.15);
                border-radius: 14px;
                box-shadow: 0 12px 40px rgba(0,0,0,0.1), 0 2px 8px rgba(99, 102, 241, 0.08);
                animation: menuSlideIn 0.25s ease;
            }
            @keyframes menuSlideIn {
                from { opacity: 0; transform: translateY(-8px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .header-actions.open {
                display: flex;
            }
            .header-actions a, .header-actions button {
                width: 100%;
                text-align: center;
                justify-content: center;
                padding: 12px 16px !important;
                border-radius: 10px !important;
                font-size: 13px !important;
            }
        }
        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .btn {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 700;
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-accent { background: var(--accent); color: white; }
        .btn-accent:hover { opacity: 0.9; }
        .btn-outline { background: rgba(79, 70, 229, 0.1); color: var(--accent); border: 1px solid rgba(79, 70, 229, 0.3); }
        .btn-danger { background: rgba(220, 38, 38, 0.1); color: var(--danger); border: 1px solid rgba(220, 38, 38, 0.3); }
        .btn-danger:hover { background: #dc2626; color: white; }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 24px 60px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            backdrop-filter: blur(12px);
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 12px;
            align-items: flex-end;
        }
        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-primary);
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            font-size: 13px;
            border-radius: 8px;
            border: 1px solid rgba(148, 163, 184, 0.4);
            background: rgba(255, 255, 255, 0.9);
            outline: none;
        }
        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-top: 10px;
        }
        th {
            background: rgba(79, 70, 229, 0.06);
            text-align: left;
            padding: 12px 14px;
            font-weight: 700;
            color: var(--text-primary);
            border-bottom: 2px solid rgba(79, 70, 229, 0.15);
        }
        td {
            padding: 14px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
        }
        tr:hover td {
            background: rgba(79, 70, 229, 0.03);
        }
    </style>
</head>
<body>

<div class="header">
    <div style="display:flex; align-items:center; justify-content:space-between; width:100%;">
        <div class="header-title">
            <h1>👥 Admin User Management</h1>
            <p>Welcome back, <strong id="adminNameDisplay" style="color:var(--accent);">Admin</strong></p>
        </div>
        <button class="hamburger-btn" id="fadhilHamburgerBtn" onclick="toggleMobileMenu()" aria-label="Menu"><span class="bar"></span></button>
    </div>
    <div class="header-actions" id="fadhilMobileMenuNav">
        <a href="admin_dashboard.html" class="btn btn-outline">⚕️ Clinical Dashboard</a>
        <button onclick="logoutAdmin()" class="btn btn-danger">Logout</button>
    </div>
</div>

<div class="container">

    <!-- Add Admin Card -->
    <div class="card">
        <div class="card-title">
            <span>➕ Create New Admin Account</span>
            <span style="font-size:11px; font-weight:600; color:var(--text-muted);">Super Admin Privilege</span>
        </div>
        
        <form onsubmit="handleCreateAdmin(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label for="newUsername">Username *</label>
                    <input type="text" id="newUsername" placeholder="e.g. dr_smith" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="newEmail">Email (optional)</label>
                    <input type="email" id="newEmail" placeholder="smith@hospital.com" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="newPassword">Password * (min 6 chars)</label>
                    <div style="position:relative;">
                        <input type="text" id="newPassword" placeholder="Enter password" required autocomplete="new-password" style="padding-right:40px; font-family:'Inter',sans-serif;">
                        <button type="button" onclick="togglePwdVisibility()" id="pwdToggleBtn" style="position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:16px; color:var(--text-muted);" title="Toggle visibility">👁</button>
                    </div>
                </div>
                <div>
                    <button type="submit" class="btn btn-accent" style="height:42px; width:100%;">
                        ➕ Register Admin
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- Registered Admins List Card -->
    <div class="card">
        <div class="card-title">
            <span>📋 Registered Administrator Accounts</span>
            <span id="adminCountBadge" style="font-size:12px; font-weight:700; background:rgba(79,70,229,0.1); color:var(--accent); padding:4px 10px; border-radius:12px;">Loading...</span>
        </div>

        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Date Joined</th>
                        <th>Last Login</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="adminListBody">
                    <tr><td colspan="6" style="text-align:center; padding:24px; color:var(--text-muted);">Loading admin accounts...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') 
    ? 'http://127.0.0.1:8000' 
    : 'https://pharma.shanudigicore.com';

// ── Auth Safeguard ────────────────────────────────────────────────────────
(function checkAuth() {
    const token = sessionStorage.getItem('access_token');
    if (!token) {
        window.location.href = 'admin_login.html';
    }
})();

document.addEventListener('DOMContentLoaded', () => {
    displayAdminName();
    loadAdmins();
});

function toggleMobileMenu() {
    const nav = document.getElementById('fadhilMobileMenuNav');
    const btn = document.getElementById('fadhilHamburgerBtn');
    if (nav) nav.classList.toggle('open');
    if (btn) btn.classList.toggle('active');
}

function togglePwdVisibility() {
    const inp = document.getElementById('newPassword');
    const btn = document.getElementById('pwdToggleBtn');
    if (inp.type === 'text') {
        inp.type = 'password';
        btn.textContent = '👁';
    } else {
        inp.type = 'text';
        btn.textContent = '🙈';
    }
}

function displayAdminName() {
    const name = sessionStorage.getItem('admin_username') || 'Admin';
    const el = document.getElementById('adminNameDisplay');
    if (el) el.textContent = name.charAt(0).toUpperCase() + name.slice(1);
}

function getAuthHeaders() {
    const token = sessionStorage.getItem('access_token');
    return {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
    };
}

function logoutAdmin() {
    sessionStorage.removeItem('access_token');
    sessionStorage.removeItem('refresh_token');
    sessionStorage.removeItem('admin_username');
    window.location.href = 'admin_login.html';
}

async function loadAdmins() {
    const tbody = document.getElementById('adminListBody');
    const badge = document.getElementById('adminCountBadge');

    try {
        const res = await fetch(`${API_BASE}/api/admin/list/`, {
            headers: getAuthHeaders()
        });

        if (!res.ok) {
            if (res.status === 401) {
                logoutAdmin();
                return;
            }
            throw new Error('Failed to load admins');
        }

        const data = await res.json();
        const admins = data.admins || [];
        badge.textContent = `${admins.length} Admin${admins.length !== 1 ? 's' : ''}`;

        const currentUser = sessionStorage.getItem('admin_username');

        tbody.innerHTML = admins.map(a => {
            const isSelf = a.username === currentUser;
            const joined = a.date_joined ? new Date(a.date_joined).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
            const lastLogin = a.last_login ? new Date(a.last_login).toLocaleString('en-US', { hour12: true, month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : 'Never';
            const roleTag = a.is_superuser 
                ? '<span style="background:rgba(79,70,229,0.12); color:var(--accent); padding:4px 8px; border-radius:6px; font-weight:700; font-size:11px;">🛡️ Super Admin</span>'
                : '<span style="background:rgba(6,182,212,0.12); color:var(--cyan); padding:4px 8px; border-radius:6px; font-weight:700; font-size:11px;">👤 Admin</span>';

            const actionBtn = isSelf
                ? '<span style="font-size:11px; font-weight:700; color:var(--accent); background:rgba(79,70,229,0.1); padding:4px 8px; border-radius:6px;">YOU (ACTIVE)</span>'
                : `<div style="display:flex; gap:6px;">
                    <button onclick="resetAdminPassword(${a.id}, '${escapeHtml(a.username)}')" class="btn btn-outline" style="padding:4px 8px; font-size:11px; width:auto; border-radius:6px;">🔑 Reset Password</button>
                    <button onclick="removeAdmin(${a.id}, '${escapeHtml(a.username)}')" class="btn btn-danger" style="padding:4px 8px; font-size:11px; width:auto; border-radius:6px;">🗑️ Delete</button>
                   </div>`;

            return `<tr>
                <td style="font-weight:700;">${escapeHtml(a.username)}</td>
                <td style="color:var(--text-secondary);">${escapeHtml(a.email || '—')}</td>
                <td>${roleTag}</td>
                <td style="color:var(--text-muted); font-size:12px;">${joined}</td>
                <td style="color:var(--text-muted); font-size:12px;">${lastLogin}</td>
                <td>${actionBtn}</td>
            </tr>`;
        }).join('');
    } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" style="color:#dc2626; text-align:center; padding:20px;">Error loading admin list. Please check your connection.</td></tr>`;
    }
}

async function handleCreateAdmin(e) {
    e.preventDefault();
    const username = document.getElementById('newUsername').value.trim();
    const email = document.getElementById('newEmail').value.trim();
    const password = document.getElementById('newPassword').value;

    if (!username || !password) {
        alert('Please provide username and password.');
        return;
    }

    try {
        const res = await fetch(`${API_BASE}/api/admin/add/`, {
            method: 'POST',
            headers: getAuthHeaders(),
            body: JSON.stringify({ username, email, password, is_superuser: false })
        });
        const data = await res.json();
        if (res.ok) {
            alert(`✅ ${data.message}`);
            document.getElementById('newUsername').value = '';
            document.getElementById('newEmail').value = '';
            document.getElementById('newPassword').value = '';
            loadAdmins();
        } else {
            alert(`⚠️ ${data.error || 'Could not add admin user.'}`);
        }
    } catch (err) {
        alert('Network error adding admin.');
    }
}

async function resetAdminPassword(id, username) {
    const newPwd = prompt(`Enter new password for admin "${username}" (min 6 characters):`);
    if (!newPwd) return;
    if (newPwd.length < 6) {
        alert('⚠️ Password must be at least 6 characters long.');
        return;
    }

    try {
        const res = await fetch(`${API_BASE}/api/admin/reset-password/`, {
            method: 'POST',
            headers: getAuthHeaders(),
            body: JSON.stringify({ id, password: newPwd })
        });
        const data = await res.json();
        if (res.ok) {
            alert(`✅ ${data.message}`);
        } else {
            alert(`⚠️ ${data.error || 'Could not reset password.'}`);
        }
    } catch (err) {
        alert('Network error resetting password.');
    }
}

async function removeAdmin(id, username) {
    if (!confirm(`Are you sure you want to remove admin account "${username}"?`)) return;
    try {
        const res = await fetch(`${API_BASE}/api/admin/delete/`, {
            method: 'POST',
            headers: getAuthHeaders(),
            body: JSON.stringify({ id })
        });
        const data = await res.json();
        if (res.ok) {
            alert(`✅ ${data.message}`);
            loadAdmins();
        } else {
            alert(`⚠️ ${data.error || 'Could not delete admin.'}`);
        }
    } catch (err) {
        alert('Network error deleting admin.');
    }
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
</script>

</body>
</html>
