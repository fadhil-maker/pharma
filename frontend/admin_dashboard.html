<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Console — Master Clinical Rule Builder</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; padding: 24px 16px; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
        .logo { font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 800; color: #38bdf8; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 28px; }
        .stat-card { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(148, 163, 184, 0.15); border-radius: 16px; padding: 20px; text-align: center; }
        .stat-val { font-family: 'Outfit', sans-serif; font-size: 28px; font-weight: 800; color: #38bdf8; margin-top: 4px; }
        
        .card { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(148, 163, 184, 0.15); border-radius: 16px; padding: 24px; margin-bottom: 28px; }
        .card-title { font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 800; margin-bottom: 16px; color: #38bdf8; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        @media(max-width:768px){ .form-grid { grid-template-columns: 1fr; } }
        
        label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; color: #cbd5e1; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 10px 14px; background: #0f172a; border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        
        .organ-checkboxes { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 8px; }
        .organ-label { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; text-transform: none; }
        .organ-label input { width: auto; }

        .btn { padding: 12px 20px; border-radius: 8px; border: none; font-weight: 800; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        .btn-cyan { background: #38bdf8; color: #0f172a; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-ghost { background: transparent; border: 1px solid rgba(148, 163, 184, 0.3); color: #fff; }

        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(148, 163, 184, 0.15); font-size: 13px; }
        th { font-weight: 800; color: #94a3b8; text-transform: uppercase; font-size: 11px; }
    </style>
</head>
<body>

<div class="container">

    <!-- Header -->
    <div class="header">
        <div class="logo">🛡️ Admin Console Dashboard</div>
        <div>
            <span style="font-size:13px; color:#94a3b8; margin-right:12px;">Logged in as: <b id="adminName" style="color:#fff;">admin</b></span>
            <button class="btn btn-ghost" onclick="logout()">Logout ➔</button>
        </div>
    </div>

    <!-- Metric Cards -->
    <div class="stats-grid">
        <div class="stat-card"><div>Registered Drugs</div><div class="stat-val">147,210</div></div>
        <div class="stat-card"><div>Interaction Pairs</div><div class="stat-val" id="pairCount">64,825</div></div>
        <div class="stat-card"><div>Reaction Categories</div><div class="stat-val">1,240</div></div>
        <div class="stat-card"><div>Active Admins</div><div class="stat-val" id="adminCount">1</div></div>
    </div>

    <!-- Admin User Creator Section -->
    <div class="card">
        <div class="card-title">👤 Add New Admin User</div>
        <form onsubmit="handleAddAdmin(event)" class="form-grid">
            <div>
                <label>New Admin Username</label>
                <input type="text" id="newAdminUser" placeholder="username" required>
            </div>
            <div>
                <label>Password</label>
                <input type="password" id="newAdminPass" placeholder="••••••••" required>
            </div>
            <div style="grid-column: 1 / -1;">
                <button type="submit" class="btn btn-cyan">➕ Create Admin Account</button>
            </div>
        </form>
    </div>

    <!-- Rule & Combination Builder -->
    <div class="card">
        <div class="card-title">➕ Create Custom Drug Pair & Reaction Rule</div>
        <form onsubmit="handleCreateRule(event)">
            <div class="form-grid">
                <div>
                    <label>Drug A (Name)</label>
                    <input type="text" id="drugA" placeholder="e.g. enoxaparin" required>
                </div>
                <div>
                    <label>Drug B (Name)</label>
                    <input type="text" id="drugB" placeholder="e.g. ketorolac" required>
                </div>
            </div>

            <div class="form-grid">
                <div>
                    <label>Clinical Reaction Description</label>
                    <textarea id="reactionText" rows="2" placeholder="Clinical mechanism description..." required></textarea>
                </div>
                <div>
                    <label>Actionable Patient Remedy</label>
                    <textarea id="remedyText" rows="2" placeholder="Advice for patient/pharmacist..." required></textarea>
                </div>
            </div>

            <div class="form-grid">
                <div>
                    <label>Severity Score (1 to 10): <b id="sevVal" style="color:#38bdf8;">8</b></label>
                    <input type="range" id="severity" min="1" max="10" value="8" oninput="document.getElementById('sevVal').textContent=this.value">
                </div>
                <div>
                    <label>Max Age Limit (Optional, e.g. 6 for pediatric)</label>
                    <input type="number" id="maxAge" placeholder="Leave empty for all ages">
                </div>
            </div>

            <div style="margin-bottom:16px;">
                <label>Target Organ Systems (11-Organ Threat Map):</label>
                <div class="organ-checkboxes">
                    <label class="organ-label"><input type="checkbox" value="1"> 🧠 Brain/CNS</label>
                    <label class="organ-label"><input type="checkbox" value="2"> 🫀 Heart</label>
                    <label class="organ-label"><input type="checkbox" value="4"> 🫁 Lungs</label>
                    <label class="organ-label"><input type="checkbox" value="8"> 🧪 Liver</label>
                    <label class="organ-label"><input type="checkbox" value="16" checked> 🩸 Stomach/GI</label>
                    <label class="organ-label"><input type="checkbox" value="32"> 🩺 Kidneys</label>
                    <label class="organ-label"><input type="checkbox" value="64" checked> 🦴 Blood</label>
                    <label class="organ-label"><input type="checkbox" value="128"> 👂 Ears</label>
                    <label class="organ-label"><input type="checkbox" value="256"> 🏋️ Muscles</label>
                    <label class="organ-label"><input type="checkbox" value="512"> 👁️ Eyes</label>
                    <label class="organ-label"><input type="checkbox" value="1024"> 🛡️ Skin/Immune</label>
                </div>
            </div>

            <button type="submit" class="btn btn-cyan">💾 Save Custom Rule to Engine</button>
        </form>
    </div>

    <!-- Master Rules Data Table -->
    <div class="card">
        <div class="card-title">📋 Custom Database Rules</div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Drug Pair</th>
                    <th>Severity</th>
                    <th>Reaction</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="rulesTable">
                <tr><td colspan="5" style="color:#94a3b8; text-align:center;">Loading custom rules...</td></tr>
            </tbody>
        </table>
    </div>

</div>

<script>
const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') 
    ? 'http://127.0.0.1:8000' 
    : 'https://pharma.shanudigicore.com';

document.addEventListener('DOMContentLoaded', () => {
    const adminUser = localStorage.getItem('adminUser');
    if (!adminUser) {
        window.location.href = 'admin_login.html';
        return;
    }
    document.getElementById('adminName').textContent = adminUser;
    loadDashboardData();
});

function logout() {
    localStorage.removeItem('adminUser');
    window.location.href = 'admin_login.html';
}

async function loadDashboardData() {
    try {
        const resRules = await fetch(`${API_BASE}/api/admin/interactions/`);
        const dataRules = await resRules.json();
        renderRulesTable(dataRules.interactions || []);

        const resAdmins = await fetch(`${API_BASE}/api/admin/list/`);
        const dataAdmins = await resAdmins.json();
        document.getElementById('adminCount').textContent = (dataAdmins.admins || []).length;
    } catch(e) {
        console.warn('Dashboard load error:', e);
    }
}

function renderRulesTable(rules) {
    const tbody = document.getElementById('rulesTable');
    if (rules.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="color:#94a3b8; text-align:center;">No custom database rules added yet.</td></tr>';
        return;
    }
    tbody.innerHTML = rules.map(r => `
        <tr>
            <td>#${r.id}</td>
            <td><b>${r.drug_a}</b> + <b>${r.drug_b}</b></td>
            <td><span style="color:#ef4444; font-weight:800;">${r.severity}/10</span></td>
            <td>${r.reaction}</td>
            <td><button class="btn btn-danger" style="padding:4px 10px; font-size:12px;" onclick="deleteRule(${r.id})">Delete</button></td>
        </tr>
    `).join('');
}

async function handleAddAdmin(e) {
    e.preventDefault();
    const u = document.getElementById('newAdminUser').value.trim();
    const p = document.getElementById('newAdminPass').value.trim();
    
    try {
        const res = await fetch(`${API_BASE}/api/admin/add/`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        if (res.ok) {
            alert(`✅ ${data.message}`);
            document.getElementById('newAdminUser').value = '';
            document.getElementById('newAdminPass').value = '';
            loadDashboardData();
        } else {
            alert(`⚠️ ${data.error}`);
        }
    } catch(e) { alert('Failed to add admin.'); }
}

async function handleCreateRule(e) {
    e.preventDefault();
    const da = document.getElementById('drugA').value.trim();
    const db = document.getElementById('drugB').value.trim();
    const rx = document.getElementById('reactionText').value.trim();
    const rem = document.getElementById('remedyText').value.trim();
    const sev = document.getElementById('severity').value;
    const maxAge = document.getElementById('maxAge').value;

    let mask = 0;
    document.querySelectorAll('.organ-checkboxes input:checked').forEach(cb => {
        mask |= parseInt(cb.value);
    });

    const custom_factors = {};
    if (maxAge) custom_factors.max_age = parseInt(maxAge);

    try {
        const res = await fetch(`${API_BASE}/api/admin/interactions/create/`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                drug_a: da,
                drug_b: db,
                reaction: rx,
                remedy: rem,
                severity: sev,
                organ_bitmask: mask,
                custom_factors: custom_factors
            })
        });
        const data = await res.json();
        if (res.ok) {
            alert('✅ Custom Interaction Rule Saved Successfully!');
            document.getElementById('drugA').value = '';
            document.getElementById('drugB').value = '';
            document.getElementById('reactionText').value = '';
            document.getElementById('remedyText').value = '';
            loadDashboardData();
        } else {
            alert(`⚠️ ${data.error}`);
        }
    } catch(e) { alert('Failed to save rule.'); }
}

async function deleteRule(id) {
    if (!confirm('Are you sure you want to delete this rule?')) return;
    try {
        await fetch(`${API_BASE}/api/admin/interactions/delete/`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ id: id })
        });
        loadDashboardData();
    } catch(e) { alert('Failed to delete rule.'); }
}
</script>

</body>
</html>
